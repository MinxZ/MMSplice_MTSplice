# Genome Configuration for MMSplice Modal Deployment
#
# Add your custom genomes here. Each genome needs:
#   - name: Unique identifier
#   - gtf_url: URL to GTF annotation file (can be .gz)
#   - fasta_url: URL to FASTA reference file (can be .gz)
#   - description: Human-readable description
#
# After adding a genome, run:
#   modal run deployment/modal_app.py::setup_custom_genome --genome YOUR_GENOME_NAME

genomes:
  # Human Genomes
  GRCh38:
    gtf_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_45/gencode.v45.annotation.gtf.gz"
    fasta_url: "ftp://ftp.ensembl.org/pub/release-110/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz"
    description: "Human genome GRCh38/hg38 (GENCODE v45)"

  GRCh37:
    gtf_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_19/gencode.v19.annotation.gtf.gz"
    fasta_url: "ftp://ftp.ensembl.org/pub/grch37/current/fasta/homo_sapiens/dna/Homo_sapiens.GRCh37.dna.primary_assembly.fa.gz"
    description: "Human genome GRCh37/hg19 (GENCODE v19)"

  # Mouse Genomes
  GRCm39:
    gtf_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M33/gencode.vM33.annotation.gtf.gz"
    fasta_url: "ftp://ftp.ensembl.org/pub/release-110/fasta/mus_musculus/dna/Mus_musculus.GRCm39.dna.primary_assembly.fa.gz"
    description: "Mouse genome GRCm39 (GENCODE vM33)"

  GRCm38:
    gtf_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/gencode.vM25.annotation.gtf.gz"
    fasta_url: "ftp://ftp.ensembl.org/pub/release-102/fasta/mus_musculus/dna/Mus_musculus.GRCm38.dna.primary_assembly.fa.gz"
    description: "Mouse genome GRCm38/mm10 (GENCODE vM25)"

  # Rat Genome
  Rnor_6.0:
    gtf_url: "ftp://ftp.ensembl.org/pub/release-110/gtf/rattus_norvegicus/Rattus_norvegicus.Rnor_6.0.110.gtf.gz"
    fasta_url: "ftp://ftp.ensembl.org/pub/release-110/fasta/rattus_norvegicus/dna/Rattus_norvegicus.Rnor_6.0.dna.toplevel.fa.gz"
    description: "Rat genome Rnor_6.0 (Ensembl release 110)"

  # Zebrafish Genome
  GRCz11:
    gtf_url: "ftp://ftp.ensembl.org/pub/release-110/gtf/danio_rerio/Danio_rerio.GRCz11.110.gtf.gz"
    fasta_url: "ftp://ftp.ensembl.org/pub/release-110/fasta/danio_rerio/dna/Danio_rerio.GRCz11.dna.primary_assembly.fa.gz"
    description: "Zebrafish genome GRCz11 (Ensembl release 110)"

  # Drosophila Genome
  BDGP6.32:
    gtf_url: "ftp://ftp.ensembl.org/pub/release-110/gtf/drosophila_melanogaster/Drosophila_melanogaster.BDGP6.32.110.gtf.gz"
    fasta_url: "ftp://ftp.ensembl.org/pub/release-110/fasta/drosophila_melanogaster/dna/Drosophila_melanogaster.BDGP6.32.dna.toplevel.fa.gz"
    description: "Fruit fly genome BDGP6.32/dm6 (Ensembl release 110)"

  # C. elegans Genome
  WBcel235:
    gtf_url: "ftp://ftp.ensembl.org/pub/release-110/gtf/caenorhabditis_elegans/Caenorhabditis_elegans.WBcel235.110.gtf.gz"
    fasta_url: "ftp://ftp.ensembl.org/pub/release-110/fasta/caenorhabditis_elegans/dna/Caenorhabditis_elegans.WBcel235.dna.toplevel.fa.gz"
    description: "C. elegans genome WBcel235/ce11 (Ensembl release 110)"

# Add your custom genomes below:
# Example:
#   MyCustomGenome:
#     gtf_url: "https://your-server.com/path/to/annotations.gtf.gz"
#     fasta_url: "https://your-server.com/path/to/genome.fa.gz"
#     description: "My custom genome assembly"
